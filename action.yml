name: "Ratchet"
description: "Catch quality regressions in your AI features before they merge."
branding:
  icon: "trending-up"
  color: "blue"

inputs:
  anthropic-api-key:
    description: "Anthropic API key. Store it as a repository secret."
    required: true
  directory:
    description: "Directory to check."
    required: false
    default: "."
  samples:
    description: "Runs per case. More samples means a steadier signal and a bigger bill."
    required: false
    default: "3"
  threshold:
    description: "Pass-rate drop that counts as a regression."
    required: false
    default: "0.34"
  comment:
    description: "Post the result as a pull request comment."
    required: false
    default: "true"
  fail-on-regression:
    description: "Fail the job when a case regresses."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run Ratchet
      id: ratchet
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set +e
        npx --yes prompt-ratchet check \
          --dir "${{ inputs.directory }}" \
          --samples "${{ inputs.samples }}" \
          --threshold "${{ inputs.threshold }}" \
          --comment ratchet-comment.md
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('ratchet-comment.md')) return;
          const body = fs.readFileSync('ratchet-comment.md', 'utf8');
          const marker = '### Ratchet';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(
            (c) => c.user.type === 'Bot' && c.body.startsWith(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Fail on regression
      if: ${{ inputs.fail-on-regression == 'true' && steps.ratchet.outputs.exit_code != '0' }}
      shell: bash
      run: |
        echo "Ratchet found a quality regression. See the pull request comment."
        exit 1
